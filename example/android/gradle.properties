org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter Gradle Plugin still requires the legacy AGP DSL.
android.newDsl=false
# Built-in Kotlin requires Flutter 3.47 or later. On Flutter 3.44.x the Flutter
# Gradle Plugin applies KGP to every subproject, which fails with built-in Kotlin.
android.builtInKotlin=true
# Temporary opt-out for flutter_inappwebview_android 1.1.3, which still uses
# getDefaultProguardFile('proguard-android.txt'). Removed in AGP 10.
android.r8.proguardAndroidTxt.disallowed=false
